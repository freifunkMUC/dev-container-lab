ipv6 forwarding
!
interface lo
  ip address 203.0.113.42/32
  ipv6 address 2001:db8:cafe::1/128
!
interface cpe1
  ip address 203.0.113.2/30
!
interface server
  ip address 203.0.113.65/30
  ipv6 address 2001:db8:cafe:1::1/64
!
! The service LANs of the control plane (broker, MQTT, haproxy), one per site.
interface svc-a
  ip address 203.0.113.129/28
!
interface svc-b
  ip address 203.0.113.145/28
!
router bgp 65000
  bgp router-id 203.0.113.42
  bgp bestpath as-path multipath-relax
  no bgp ebgp-requires-policy
  no bgp default ipv4-unicast

  neighbor PEER peer-group
  neighbor PEER remote-as external
  neighbor gw01 interface v6only peer-group PEER
  neighbor gw02 interface v6only peer-group PEER
  neighbor gw03 interface v6only peer-group PEER
  neighbor gw04 interface v6only peer-group PEER
  ! The haproxy of each site announces broker.lab (anycast). The kernel
  ! picks one of the two paths by source and destination address.
  neighbor LB peer-group
  neighbor LB remote-as external
  neighbor LB timers 1 3
  neighbor 203.0.113.130 peer-group LB
  neighbor 203.0.113.146 peer-group LB

  address-family ipv4 unicast
    redistribute connected
    aggregate-address 0.0.0.0/0 summary-only
    maximum-paths 4
    neighbor PEER activate
    neighbor LB activate
  exit-address-family

  address-family ipv6 unicast
    redistribute connected
    aggregate-address ::/0 summary-only
    neighbor PEER activate
  exit-address-family
!
