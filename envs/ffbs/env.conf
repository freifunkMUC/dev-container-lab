# shellcheck shell=bash disable=SC2034
# ffbs: the Parker setup of Freifunk Braunschweig, as upstream has it.
# Three concentrators and one exit, built with the upstream ffbs-ansible
# (submodule envs/ffbs/ffbs-ansible), etcd for the node configuration, and
# APs with the stock FFBS Gluon firmware. See envs/ffbs/README.md.

LAB_NAME=ffbs-lab
TOPOLOGY=envs/ffbs/ffbs.clab.yml
IMAGE_PREFIX=ffbs-lab
BRIDGES="fb-ap1-lan fb-ap2-lan fb-wan"
GATEWAYS="concentrator1 concentrator2 concentrator3 exit1"
GATEWAY_NODES="${GATEWAYS}"
GATEWAY_USER=debian
GATEWAY_PASS=ffmuc
PACKER_VARS=../../envs/ffbs/gateway.pkrvars.hcl
APS="ap-1 ap-2"
# The x86-64 image of the FFBS firmware. Put it into gluon/.
GLUON_IMAGE="gluon-ffbs-*-x86-64*.img"
ANDROID_BRIDGE=fb-ap1-lan

# A copy of the upstream repository with the lab inventory, variables and
# keys of envs/ffbs/lab/ instead of the production ones. Packer builds from
# the copy, so the submodule stays clean.
env_prepare() {
	local up=envs/ffbs/ffbs-ansible stage=gateway/packer/ffbs-stage
	if [ ! -f "${up}/playbook.yml" ]; then
		echo "No upstream ffbs-ansible at ${up}. Run 'git submodule update --init'." >&2
		return 1
	fi
	if [ ! -f envs/ffbs/lab/files/node-config.sec ] \
		|| [ ! -f envs/ffbs/lab/files/node-config.pub ]; then
		echo "ffbs: making the node config signing key (keygen.sh signify)"
		envs/ffbs/lab/keygen.sh signify || return 1
	fi
	if [ ! -f envs/ffbs/lab/files/etcd-ca.pem ] \
		|| [ ! -f envs/ffbs/lab/files/concentrator3/etcd-client.key.pem ]; then
		echo "ffbs: making the etcd lab certificates (keygen.sh etcd)"
		envs/ffbs/lab/keygen.sh etcd || return 1
	fi
	rm -rf "${stage}"
	mkdir -p "${stage}"
	tar -C "${up}" --exclude=.git -cf - . | tar -C "${stage}" -xf -
	rm -rf "${stage}"/{group_vars,host_vars,files,ansible.cfg,vault.gpg,vault.sh}
	tar -C envs/ffbs/lab --exclude=keygen.sh -cf - . | tar -C "${stage}" -xf -
	# ansible-core 2.16 and later removed "include"; upstream still uses it.
	grep -rl '^  include: ' "${stage}/roles" | xargs -r sed -i.bak 's/^  include: /  import_tasks: /'
	find "${stage}/roles" -name '*.bak' -delete
}

# The APs check the node configuration with the generated signify key.
env_deploy_vars() {
	local pub=envs/ffbs/lab/files/node-config.pub
	if [ ! -f "${pub}" ]; then
		echo "no ${pub}: run './lab.sh -e ffbs build' first" >&2
		return 1
	fi
	echo "FFBS_CONFIGPUBKEY=$(sed -n 2p "${pub}")"
}

env_build_extra() {
	docker build envs/ffbs/internet -t "${IMAGE_PREFIX}:internet"
}

env_tests() {
	envs/ffbs/test.sh "$@"
}

# shellcheck disable=SC2016
env_collect_logs() {
	local d="$1" n
	for n in ${APS}; do
		timeout 120 ./node-cmd.sh "${n}" 'wg show all; ip addr; ip route; logread | tail -200' 60 \
			> "${d}/${n}.state.txt" 2>&1
	done
	for n in ${GATEWAY_NODES}; do
		timeout 120 ./node-cmd.sh "${n}" 'sudo wg show all; ip -br addr; ip route show vrf freifunk; ip -6 route show vrf freifunk | head -50; sudo birdc show protocols; sudo journalctl -n 200 --no-pager -u etcd -u lab-etcd-init -u etcd-config-web -u concentrator-config -u concentrator-route' 60 \
			> "${d}/${n}.state.txt" 2>&1
	done
}
