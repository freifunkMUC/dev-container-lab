# shellcheck shell=bash disable=SC2034
# example: a template for a new environment. It uses the ffbs gateways and
# topology, but your own Gluon image. Copy this directory to envs/NAME and
# change it. See docs/environments.md.

# Start from an environment that exists. Set only what is different.
# shellcheck source=envs/ffbs/env.conf
. "${LAB_ROOT}/envs/ffbs/env.conf"

# Your Gluon image: an x86-64 .img in gluon/ (glob), a path, or an https URL
# of an .img or .img.gz file. GLUON_IMAGE_URL in the shell overrides it.
GLUON_IMAGE="gluon-*-x86-64*.img"

# Your own gateway provisioning: a Packer variable file (relative to
# gateway/packer/) that sets the base image and the Ansible playbooks.
# PACKER_VARS=../../envs/NAME/gateway.pkrvars.hcl

# Your own topology. Set LAB_NAME to its "name:" and IMAGE_PREFIX to the
# image prefix it uses. Use another IMAGE_PREFIX than the env you copy, else
# the builds of the two environments replace the images of each other.
# TOPOLOGY=envs/NAME/NAME.clab.yml
# LAB_NAME=NAME-lab
# IMAGE_PREFIX=NAME-lab
# BRIDGES="..."

# Hooks: define env_prepare, env_build_extra, env_tests and env_collect_logs
# again to change them. The ffbs hooks stay in effect here.
