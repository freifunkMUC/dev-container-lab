# shellcheck shell=bash disable=SC2034
# ffmuc: the FFMUC multi-PoP active/standby lab (MULTIPOP-AS.md).
# Two sites with two gateways each, wgkex brokers, DNS64 and NAT64, and
# Gluon APs with the parker-sites prototype. This is the default environment.

LAB_NAME=ffmuc-mp-as
TOPOLOGY=ffmuc.clab.yml
IMAGE_PREFIX=ffmuc-lab
BRIDGES="as-ap1-lan as-ap2-lan as-ap3-lan as-ap4-lan as-home1 as-home2 as-gw-vpn"
GATEWAYS="parker-gw01 parker-gw02 parker-gw03 parker-gw04"
GATEWAY_NODES="gateway-gw01 gateway-gw02 gateway-gw03 gateway-gw04"
APS="ap-1 ap-2 ap-3 ap-4"
# The gateways use the defaults of gateway/packer/gateway.pkr.hcl: Ubuntu,
# the ffbs-ansible fork (gateway/packer/ffbs-ansible) and multipop/overlay.yml.
PACKER_VARS=""
GLUON_IMAGE="gluon-ffmuc-*-x86-64*.img"
GLUON_URADVD_PATCH=multipop/patches/uradvd.patch
ANDROID_BRIDGE=as-ap1-lan
# IPv4 through the CLAT of the node, IPv6, NAT64, and DNS64 for internet.lab.
ANDROID_TARGETS="4:203.0.113.42 6:2001:db8:cafe::1 6:64:ff9b::cb00:712a dns:internet.lab"

env_prepare() {
	# The gateways install wgkex from a source tree, so Ansible needs a copy
	# of it at gateway/packer/wgkex-src (wgkex_src_dir in ffbs-ansible). It
	# comes from the wgkex submodule; point WGKEX_SRC at a checkout of your
	# own to build a different revision.
	local src="${WGKEX_SRC:-gateway/packer/wgkex}"
	if [ ! -e "${src}/wgkex/broker/app.py" ]; then
		echo "No wgkex source at ${src}." >&2
		echo "Run 'git submodule update --init', or set WGKEX_SRC to your own." >&2
		return 1
	fi
	rm -rf gateway/packer/wgkex-src
	mkdir -p gateway/packer/wgkex-src
	tar -C "${src}" --exclude=.git --exclude=bazel-\* -cf - . |
		tar -C gateway/packer/wgkex-src -xf -
	# Per-site prefixes and primary_site in the broker answer. LAB
	# PROTOTYPE, see gateway/packer/multipop/.
	patch -d gateway/packer/wgkex-src -p1 < gateway/packer/multipop/wgkex-multipop.patch

	# Broker plane (multipop/brokers/): the stateless brokers run the same
	# patched source, and EMQX gets "ip" for the lab address setup.
	docker build -f multipop/brokers/Dockerfile gateway/packer/wgkex-src -t "${IMAGE_PREFIX}:broker"
	docker build -f multipop/brokers/Dockerfile.emqx multipop/brokers -t "${IMAGE_PREFIX}:emqx"
}

env_tests() {
	python3 tests/multipop_as.py "$@"
}

# shellcheck disable=SC2016,SC2024
env_collect_logs() {
	local d="$1" ap gw dc
	for ap in ${APS}; do
		timeout 120 ./node-cmd.sh "${ap}" 'cat /tmp/parker-as/status; for f in /tmp/parker-as/ra-args /tmp/parker-as/ra-state; do echo "$f: $(cat $f)"; done; ip -6 rule; ip -6 route show table all | grep -v "^local\|^multicast\|fe80"; ip route; ip6tables -S parker_src; ip6tables -S FORWARD | head -5; ip6tables -S OUTPUT | head -5; cat /tmp/parker-as/dns-servers; wg show all; cat /tmp/ff-Ohb0ba0u/noderoute.json; ps w | grep -E "uradvd|clat|parker"; logread | tail -300' 60 \
			> "${d}/${ap}.state.txt" 2>&1
	done
	for gw in ${GATEWAY_NODES}; do
		timeout 120 ./node-cmd.sh "${gw}" 'sudo vtysh -c "show bgp summary" -c "show ip bgp" -c "show bgp ipv6"; sudo wg show all; ip route; ip -6 route | head -50; sudo jool session display --numeric 2>/dev/null | head -20; sudo journalctl -n 300 --no-pager -u "wgkex*" -u unbound -u frr' 60 \
			> "${d}/${gw}.state.txt" 2>&1
	done
	sudo docker exec "clab-${LAB}-internet" vtysh -c 'show bgp summary' -c 'show ip bgp' -c 'show bgp ipv6' \
		> "${d}/internet.bgp.txt" 2>&1
	{
		sudo docker exec "clab-${LAB}-emqx-muc-1" emqx ctl cluster status
		for dc in dc-muc dc-vie; do
			echo "== ${dc}"
			sudo docker exec "clab-${LAB}-${dc}" sh -c 'ip route; vtysh -c "show bgp summary"'
		done
	} > "${d}/broker-plane.txt" 2>&1
}
