# One haproxy per site in front of all brokers, as in production
# (ffmuc-salt-public, broker_backend). Both answer on the anycast address
# broker.lab (198.51.100.100) while at least one broker is up.
global
	log stdout format raw local0

defaults
	mode http
	log global
	option httplog
	timeout connect 1s
	timeout client 30s
	timeout server 30s
	retries 2
	option redispatch 1

frontend broker
	bind *:80
	monitor-uri /haproxy-health
	monitor fail if { nbsrv(brokers) lt 1 }
	http-request deny if { path_beg /metrics }
	default_backend brokers

backend brokers
	balance roundrobin
	# Overwrite, do not append: the brokers trust only this proxy.
	http-request set-header X-Forwarded-For %[src]
	option httpchk GET /api/v3/lab/health
	default-server inter 1s fall 2 rise 2
	server broker-muc-1 198.51.100.67:5000 check
	server broker-muc-2 198.51.100.68:5000 check
	server broker-vie-1 198.51.100.83:5000 check
	server broker-vie-2 198.51.100.84:5000 check
