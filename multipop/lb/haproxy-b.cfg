# LAB: the haproxy of site B, like the broker_backend of production. The
# brokers of the own site get most requests. All brokers are active, so a
# retry can go to the other site at once when the own brokers fail.
global
	log stdout format raw local0

defaults
	mode http
	log global
	option httplog
	timeout connect 1s
	timeout client 10s
	timeout server 5s
	# A request that fails on one broker goes to the next one.
	retries 3
	option redispatch 1
	retry-on conn-failure empty-response response-timeout 503

frontend broker
	bind :80
	monitor-uri /haproxy-alive
	option forwardfor
	http-request deny if { path_beg /metrics }
	default_backend brokers

backend brokers
	balance random
	option httpchk GET /api/health
	http-check expect status 200
	default-server check inter 1s fall 2 rise 2
	server broker-a1 203.0.113.131:5000 weight 1
	server broker-a2 203.0.113.132:5000 weight 1
	server broker-b1 203.0.113.147:5000 weight 10
	server broker-b2 203.0.113.148:5000 weight 10
