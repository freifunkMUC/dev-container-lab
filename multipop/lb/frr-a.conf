! LAB: announce broker.lab (203.0.113.250) to the internet router while
! haproxy runs. The watchdog in entrypoint.sh adds and removes the address.
frr defaults datacenter
!
router bgp 65201
  bgp router-id 203.0.113.130
  no bgp ebgp-requires-policy
  neighbor 203.0.113.129 remote-as 65000
  neighbor 203.0.113.129 timers 1 3
  address-family ipv4 unicast
    network 203.0.113.250/32
  exit-address-family
!
