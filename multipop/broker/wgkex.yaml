# LAB: the configuration of the brokers. Same as the gateways have it in
# gateway/packer/ffbs-ansible (roles/wgkex/templates/wgkex.yaml.j2), but the
# allocations are in MQTT (sites.json: "ipam": "mqtt"), so the brokers keep
# no state. entrypoint.sh sets @MQTT@ and adds the signing key.
domains: []
domain_prefixes: []

workers:
  parker-gw01: {id: 1, weight: 1, pop: pop-a, endpoint_name: gw1.lab}
  parker-gw02: {id: 2, weight: 1, pop: pop-a, endpoint_name: gw2.lab}
  parker-gw03: {id: 3, weight: 1, pop: pop-b, endpoint_name: gw3.lab}
  parker-gw04: {id: 4, weight: 1, pop: pop-b, endpoint_name: gw4.lab}
sticky_worker_tolerance: 15

parker:
  enabled: True
  464xlat: True
  retry_interval: 120
  wg_keepalive: 25
  # Not used: sites.json gives each site an MQTT IPAM.
  ipam: json
  prefixes:
    ipv4:
      clat_subnet: 10.0.4.0/22
    ipv6:
      length: 63

mqtt:
  broker_url: @MQTT@
  broker_port: 1883
  username: ''
  password: ''
  keepalive: 5
  tls: False

broker_listen:
  host: 0.0.0.0
  port: 5000

logging_config:
  formatters:
    standard:
      format: '%(asctime)s,%(msecs)d %(levelname)-8s [%(filename)s:%(lineno)d] %(message)s'
  handlers:
    console:
      class: logging.StreamHandler
      formatter: standard
  root:
    handlers:
      - console
    level: INFO
  version: 1
